name: Component tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        esphome: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.esphome == 'latest'
        run: python -m pip install --upgrade esphome
      - run: python -m esphome version
      - run: python -m pytest tests -q
      - run: cmake -S tests -B .build/native -DPython3_EXECUTABLE="$(which python)" -DENABLE_SANITIZERS=ON
      - run: cmake --build .build/native
      - run: ctest --test-dir .build/native --output-on-failure
  firmware:
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome: [pinned, latest]
        configuration: [minimal, full, idf, two_instances, dry_offset]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.esphome == 'latest'
        run: python -m pip install --upgrade esphome
      - run: python -m esphome version
      - run: python -m esphome compile tests/${{ matrix.configuration }}.yaml
