esphome:
  name: hisense-test-minimal
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
  baud_rate: 0
external_components:
  - source:
      type: local
      path: ../components
    components: [hisense_ac]
uart:
  id: ac_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
climate:
  - platform: hisense_ac
    id: ac
    name: Test AC
    uart_id: ac_uart
